<style>
:root{--b1:#ffe4ef;--b2:#e9e0fb;--card:#fff;--ink:#5b3a52;--pink:#ff8fb8;--soft:#ffd9e8;--ok:#a8e8c8;--bad:#ffb3bf;--sh:0 10px 28px #f3a6c866;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2c1c2c;--b2:#231c36;--card:#3b2b3f;--ink:#ffeaf4;--soft:#57405c;--ok:#2f6a52;--bad:#7b3a4a;--sh:0 10px 28px #0006}}
:root[data-theme="dark"]{--b1:#2c1c2c;--b2:#231c36;--card:#3b2b3f;--ink:#ffeaf4;--soft:#57405c;--ok:#2f6a52;--bad:#7b3a4a;--sh:0 10px 28px #0006}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--b1),var(--b2));background-attachment:fixed;min-height:100%;font-size:17px;line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px 60px}
header{text-align:center;padding:22px 10px 6px}
h1{margin:0;font-size:clamp(34px,8vw,52px);color:var(--pink);text-shadow:0 3px 0 #fff,0 6px 14px #ff8fb855;letter-spacing:1px}
.sub{opacity:.8}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-radius:40px;box-shadow:var(--sh);padding:8px 16px;margin:14px 0;display:flex;gap:12px;align-items:center}
.track{flex:1;height:14px;border-radius:9px;background:var(--soft);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#ffb3d1,#ff8fb8);border-radius:9px;transition:width .5s}
.card{background:var(--card);border-radius:34px;padding:22px 20px;margin:20px 0;box-shadow:var(--sh),inset 0 0 0 4px var(--soft);position:relative}
.card:before{content:attr(data-m);position:absolute;top:-22px;right:18px;font-size:38px;filter:drop-shadow(0 3px 3px #0002)}
h2{margin:0 0 4px;color:var(--pink);font-size:23px}
.d{margin:0 0 14px;opacity:.85;font-style:italic}
.it{margin:10px 0;padding:8px 12px;border-radius:20px;background:color-mix(in srgb,var(--soft) 40%,transparent)}
.lead{opacity:.7;font-size:15px}
.key{display:inline-block;background:var(--pink);color:#fff;border-radius:14px;padding:0 10px;font-weight:600;font-size:14px;margin:0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px dashed var(--pink);border-radius:16px;padding:3px 10px;outline:none;min-width:70px;max-width:100%}
input:focus,select:focus,textarea:focus{border-style:solid;box-shadow:0 0 0 4px #ff8fb844}
input.ok,select.ok,.ok{background:var(--ok)!important;border-color:#5cc49a}
input.no,select.no,.no{background:var(--bad)!important;border-color:#ff7a90}
textarea{width:100%;display:block}
sup{color:var(--pink);font-weight:600;margin-right:2px}
.chip{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--pink);border-radius:20px;padding:2px 14px;margin:2px 6px 2px 0;cursor:pointer}
.chip.sel{background:var(--pink);color:#fff}
.mc{display:inline-block;padding:2px 4px;border-radius:18px}
.btns{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.b{font:inherit;font-weight:600;border:0;border-radius:26px;padding:8px 22px;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 5px 0 #e0709b}
button.b:active{transform:translateY(3px);box-shadow:0 2px 0 #e0709b}
button.b.s{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 #e6b4cb}
.res{font-weight:600}
.fl{position:fixed;font-size:28px;pointer-events:none;animation:up 1.6s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-220px) scale(1.5);opacity:0}}
.note{background:var(--soft);border-radius:20px;padding:8px 14px;margin-bottom:10px}
.leg{font-size:15px;opacity:.85;margin-bottom:6px}
.dz{display:inline-block;min-width:96px;min-height:38px;vertical-align:middle;border:2px dashed var(--pink);border-radius:18px;margin:0 3px;padding:0 4px;text-align:center;background:color-mix(in srgb,var(--soft) 50%,transparent)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:24px;background:var(--soft);min-height:54px;margin-bottom:12px}
.wd{display:inline-block;padding:1px 14px;border-radius:18px;background:var(--pink);color:#fff;font-weight:500;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #e0709b}
.wd.sel{outline:3px solid #fff;box-shadow:0 0 0 5px var(--pink)}
.wd.gh{position:fixed;transform:translate(-50%,-50%) rotate(-4deg);pointer-events:none;z-index:20;opacity:.92}
.dz .wd{box-shadow:none}
audio{width:100%;display:block;margin:6px 0 12px;border-radius:30px}
